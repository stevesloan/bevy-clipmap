[package]
name = "bevy-clipmap"
version = "1.0.5"
edition = "2024"
license = "MIT"
description = "Render huge 3D worlds using Bevy!"
repository = "https://github.com/kirillsurkov/bevy-clipmap"
exclude = ["assets/*", "screenshot.png"]

[dependencies]
bevy = "0.19.0"

[features]
# Demo A/B keybinds (B/N/V) for the AO/bent-normal experiment. Off by default so
# the library ships no input systems; the `basic` example enables it.
dev-controls = []

[dev-dependencies]
bevy = { version = "0.19.0", features = ["free_camera"] }

# PNG decoding is 10-30x slower unoptimized; keeps example startup fast in dev.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
